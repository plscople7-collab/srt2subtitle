<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRT→EXO変換 v0.2</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">SRT→EXO変換</p>
        <h1>v0.2 GitHub Pages共有版</h1>
      </div>
      <div class="api-strip">
        <label>
          <span>API URL</span>
          <input id="apiBaseInput" value="http://127.0.0.1:8002" placeholder="http://127.0.0.1:8002">
        </label>
        <button id="saveApiBaseButton" class="ghost" type="button">保存</button>
        <button id="checkApiButton" class="ghost" type="button">確認</button>
        <span id="apiStatus" class="status">未確認</span>
      </div>
      <div class="header-actions">
        <button id="saveBundleButton" class="ghost" type="button">まとめて保存</button>
        <button id="loadBundleButton" class="ghost" type="button">まとめて読込</button>
        <input id="bundleFileInput" type="file" accept=".json" hidden>
        <button id="convertButton" class="primary" type="button">変換</button>
      </div>
    </header>

    <div class="workbench">
      <section class="surface input-pane">
        <div class="section-head">
          <h2>入力</h2>
          <p id="projectStatus" class="status">未保存</p>
        </div>
        <form id="projectForm" class="project-grid">
          <label class="wide">
            <span>プロジェクト名</span>
            <input name="name" value="srt_project" required>
          </label>
          <label>
            <span>fps</span>
            <input name="fps" type="number" value="60" min="1" max="240" required>
          </label>
          <label>
            <span>幅</span>
            <input name="width" type="number" value="1920" min="1" required>
          </label>
          <label>
            <span>高さ</span>
            <input name="height" type="number" value="1080" min="1" required>
          </label>
          <label>
            <span>出力名</span>
            <input name="output_name" value="output_v2" required>
          </label>
        </form>

        <div class="section-head subhead">
          <h2>話者</h2>
          <div class="inline-actions">
            <button id="reloadPresetsButton" class="ghost" type="button">再読込</button>
            <button id="addSpeakerButton" class="ghost" type="button">話者追加</button>
          </div>
        </div>
        <div id="speakerList" class="speaker-list"></div>
      </section>

      <section class="surface preset-pane">
        <div class="section-head">
          <h2>プリセット</h2>
          <span id="activeSpeakerLabel" class="status-inline">選択中の話者: なし</span>
        </div>
        <div class="table-wrap preset-wrap">
          <table class="preset-table">
            <thead>
              <tr>
                <th>名前</th>
                <th>レイヤー</th>
                <th>文字数</th>
                <th>行数</th>
                <th>最短秒</th>
                <th>最長秒</th>
                <th>見本EXO</th>
                <th>更新日時</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="presetTableBody"></tbody>
          </table>
        </div>
        <p id="presetStatus" class="status">プリセットなし</p>
      </section>

      <section class="surface result-pane">
        <div class="section-head">
          <h2>出力</h2>
          <div class="inline-actions">
            <button id="downloadExoButton" class="ghost" type="button" disabled>EXO</button>
            <button id="downloadSrtButton" class="ghost" type="button" disabled>SRT</button>
            <button id="downloadJsonButton" class="ghost" type="button" disabled>JSON</button>
          </div>
        </div>

        <div class="check-strip">
          <span class="check-title">変換チェック</span>
          <span id="analysisSummary" class="status">未変換</span>
        </div>
        <ul id="analysisList" class="status-list"></ul>

        <div class="result-toolbar">
          <label>
            <span>話者</span>
            <select id="speakerFilter">
              <option value="">全話者</option>
            </select>
          </label>
        </div>
        <div class="table-wrap result-wrap">
          <table>
            <thead>
              <tr>
                <th>話者</th>
                <th>開始</th>
                <th>終了</th>
                <th>レイヤー</th>
                <th>本文</th>
                <th>警告</th>
              </tr>
            </thead>
            <tbody id="segmentTableBody"></tbody>
          </table>
        </div>
        <p id="generationStatus" class="status">未変換</p>
      </section>
    </div>
  </main>

  <template id="speakerTemplate">
    <article class="speaker-card">
      <div class="speaker-header">
        <h3>話者</h3>
        <div class="inline-actions">
          <button class="ghost save-preset" type="button">プリセット保存</button>
          <button class="icon-button danger remove-speaker" type="button" title="削除">×</button>
        </div>
      </div>
      <div class="speaker-grid">
        <label class="name-field">
          <span>話者名</span>
          <input name="display_name" placeholder="話者A" required>
        </label>
        <label class="preset-field">
          <span>プリセット</span>
          <select name="preset_select">
            <option value="">未選択</option>
          </select>
        </label>
        <label class="drop-field file-field" data-kind="srt">
          <span>SRT</span>
          <div class="file-picker">
            <button class="ghost pick-file" data-kind="srt" type="button">選択</button>
            <span class="file-name" data-file-label="srt">-</span>
          </div>
          <input name="srt_file" class="sr-only-file" type="file" accept=".srt" required>
        </label>
        <label class="drop-field file-field" data-kind="template">
          <span>見本EXO</span>
          <div class="file-picker">
            <button class="ghost pick-file" data-kind="template" type="button">選択</button>
            <span class="file-name" data-file-label="template">-</span>
          </div>
          <input name="template_exo" class="sr-only-file" type="file" accept=".exo" required>
        </label>
        <label>
          <span>文字数</span>
          <input name="max_chars_per_line" type="number" value="18" min="1" max="80" required>
        </label>
        <label>
          <span>行数</span>
          <input name="max_lines" type="number" value="2" min="1" max="4" required>
        </label>
        <label>
          <span>最短秒</span>
          <input name="min_duration_sec" type="number" value="0.8" min="0.1" step="0.1" required>
        </label>
        <label>
          <span>最長秒</span>
          <input name="max_duration_sec" type="number" value="4.0" min="0.1" max="10" step="0.1" required>
        </label>
        <label>
          <span>レイヤー</span>
          <input name="base_layer" type="number" value="1" min="1" required>
        </label>
      </div>
      <p class="template-preview speaker-source-status">SRT: -&#10;EXO: -</p>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
