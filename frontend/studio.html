<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声→EXO 統合スタジオ</title>
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Integrated Studio</p>
        <h1>音声→EXO</h1>
      </div>
      <div class="header-actions">
        <a class="nav-link" href="/transcriber">SRT生成</a>
        <a class="nav-link" href="/v2">SRT→EXO</a>
        <button id="runAllButton" class="primary" type="button">EXO自動保存</button>
      </div>
    </header>

    <div class="studio-grid">
      <section class="surface setup-pane">
        <div class="section-head">
          <h2>設定</h2>
          <span id="setupStatus" class="status">未実行</span>
        </div>

        <form id="projectForm" class="project-grid">
          <label class="wide">
            <span>プロジェクト</span>
            <input name="name" value="audio_exo_project" required>
          </label>
          <label>
            <span>fps</span>
            <input name="fps" type="number" value="60" min="1" max="240" required>
          </label>
          <label>
            <span>幅</span>
            <input name="width" type="number" value="1920" min="1" required>
          </label>
          <label>
            <span>高さ</span>
            <input name="height" type="number" value="1080" min="1" required>
          </label>
          <label>
            <span>出力名</span>
            <input name="output_name" value="output_studio" required>
          </label>
          <label>
            <span>モデル</span>
            <select id="modelInput">
              <option value="tiny">tiny</option>
              <option value="base" selected>base</option>
              <option value="small">small</option>
              <option value="medium">medium</option>
            </select>
          </label>
          <label>
            <span>言語</span>
            <input id="languageInput" value="ja">
          </label>
        </form>

        <div class="section-head subhead">
          <h2>話者</h2>
          <div class="inline-actions">
            <button id="reloadPresetsButton" class="ghost" type="button">プリセット再読込</button>
            <button id="addSpeakerButton" class="ghost" type="button">話者追加</button>
          </div>
        </div>
        <div id="speakerList" class="speaker-list"></div>
      </section>

      <section class="surface preset-pane">
        <div class="section-head">
          <h2>プリセット</h2>
          <span id="presetStatus" class="status">読込中</span>
        </div>
        <div class="table-wrap preset-wrap">
          <table>
            <thead>
              <tr>
                <th>名前</th>
                <th>レイヤー</th>
                <th>EXO</th>
                <th>更新</th>
              </tr>
            </thead>
            <tbody id="presetTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="surface result-pane">
        <div class="section-head">
          <h2>結果</h2>
          <div class="inline-actions">
            <button id="downloadExoButton" class="ghost" type="button" disabled>EXO</button>
            <button id="downloadSrtButton" class="ghost" type="button" disabled>SRT</button>
            <button id="downloadJsonButton" class="ghost" type="button" disabled>JSON</button>
          </div>
        </div>

        <div class="progress-list" id="progressList"></div>
        <div class="check-strip">
          <span>変換</span>
          <span id="analysisSummary" class="status">未変換</span>
        </div>
        <ul id="analysisList" class="status-list"></ul>

        <div class="table-wrap result-wrap">
          <table>
            <thead>
              <tr>
                <th>話者</th>
                <th>開始</th>
                <th>終了</th>
                <th>レイヤー</th>
                <th>本文</th>
                <th>警告</th>
              </tr>
            </thead>
            <tbody id="segmentTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <template id="speakerTemplate">
    <article class="speaker-card">
      <div class="speaker-header">
        <h3>話者</h3>
        <button class="icon-button danger remove-speaker" type="button" title="削除">×</button>
      </div>
      <div class="speaker-grid">
        <label class="name-field">
          <span>話者名</span>
          <input name="display_name" placeholder="話者" required>
        </label>
        <label class="preset-field">
          <span>プリセット</span>
          <select name="preset_select">
            <option value="">未選択</option>
          </select>
        </label>
        <label class="drop-field file-field" data-kind="media">
          <span>音声/動画</span>
          <div class="file-picker">
            <button class="ghost pick-file" data-kind="media" type="button">選択</button>
            <span class="file-name" data-file-label="media">-</span>
          </div>
          <input name="media_file" class="sr-only-file" type="file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg,.opus,.wma,.webm,.mp4,.mov,.mkv">
        </label>
        <label class="drop-field file-field" data-kind="srt">
          <span>SRT</span>
          <div class="file-picker">
            <button class="ghost pick-file" data-kind="srt" type="button">選択</button>
            <span class="file-name" data-file-label="srt">-</span>
          </div>
          <input name="srt_file" class="sr-only-file" type="file" accept=".srt">
        </label>
        <label class="drop-field file-field" data-kind="template">
          <span>見本EXO</span>
          <div class="file-picker">
            <button class="ghost pick-file" data-kind="template" type="button">選択</button>
            <span class="file-name" data-file-label="template">-</span>
          </div>
          <input name="template_exo" class="sr-only-file" type="file" accept=".exo">
        </label>
        <label>
          <span>文字数</span>
          <input name="max_chars_per_line" type="number" value="18" min="1" max="80" required>
        </label>
        <label>
          <span>行数</span>
          <input name="max_lines" type="number" value="2" min="1" max="4" required>
        </label>
        <label>
          <span>最短秒</span>
          <input name="min_duration_sec" type="number" value="0.8" min="0.1" step="0.1" required>
        </label>
        <label>
          <span>最長秒</span>
          <input name="max_duration_sec" type="number" value="4.0" min="0.1" max="10" step="0.1" required>
        </label>
        <label>
          <span>レイヤー</span>
          <input name="base_layer" type="number" value="1" min="1" required>
        </label>
      </div>
      <p class="source-status">音声: - / SRT: - / EXO: -</p>
    </article>
  </template>

  <script src="/studio.js"></script>
</body>
</html>
